name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build the plugin
        run: ./gradlew test buildPlugin --console=plain

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: tendril-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      # renderings of the tool windows made by UiPreviewTest, handy to look at in a pull request
      - name: Upload the UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-previews
          path: build/ui-preview/*.png
          if-no-files-found: ignore

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests
            recorder/build/reports/tests
