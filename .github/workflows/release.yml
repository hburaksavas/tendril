name: Release

# Push a tag like v0.2.0 (see "Releasing" in the README). The tag must match pluginVersion in gradle.properties
# and CHANGELOG.md must have a section for it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # empty when the secret is not set: the signing and publishing steps below are skipped then
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check the version is consistent
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          declared=$(grep '^pluginVersion=' gradle.properties | cut -d= -f2)
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::The tag is v$VERSION but gradle.properties says pluginVersion=$declared"
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## [$VERSION]'"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build the plugin
        run: ./gradlew test buildPlugin --console=plain -PpluginVersion=${{ steps.version.outputs.value }}

      - name: Sign the plugin
        if: env.CERTIFICATE_CHAIN != '' && env.PRIVATE_KEY != ''
        run: ./gradlew signPlugin --console=plain -PpluginVersion=${{ steps.version.outputs.value }}

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## \[/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Tendril ${{ steps.version.outputs.value }}
          body_path: release-notes.md
          files: build/distributions/*.zip
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}

      - name: Publish to the JetBrains Marketplace
        if: env.PUBLISH_TOKEN != ''
        run: ./gradlew publishPlugin --console=plain -PpluginVersion=${{ steps.version.outputs.value }}
