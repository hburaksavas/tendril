name: Verify

# The IntelliJ Plugin Verifier checks the plugin against the recommended IDE versions and reports use of removed or
# internal APIs. It downloads several IDEs, so it runs weekly and on demand instead of on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify the plugin
        run: ./gradlew verifyPlugin --console=plain

      - name: Upload the verifier reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-reports
          path: build/reports/pluginVerifier
          if-no-files-found: ignore
